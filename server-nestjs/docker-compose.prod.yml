  app-api:
    image: ${REGISTRY}/pm-app-api:${VERSION}
    container_name: pm-app-api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - app_api_logs:/app/logs
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

  notification:
    image: ${REGISTRY}/pm-notification:${VERSION}
    container_name: pm-notification
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
    volumes:
      - notification_logs:/app/logs
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

  cronjob-worker:
    image: ${REGISTRY}/pm-cronjob-worker:${VERSION}
    container_name: pm-cronjob-worker
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 3003
      NODE_OPTIONS: "--expose-gc --max-old-space-size=1024"
    volumes:
      - cronjob_logs:/app/logs
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

volumes:
  postgres_data:
  redis_data:
  # zookeeper_data:
  # zookeeper_logs:
  # kafka_data:
  app_api_logs:
  notification_logs:
  cronjob_logs:

networks:
  pm_network:
    driver: bridge

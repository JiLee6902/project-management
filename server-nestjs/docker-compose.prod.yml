services:
  # Migration job - runs automatically before app services start
  migration:
    platform: linux/amd64
    image: ${REGISTRY}/pm-app-api:${VERSION}
    container_name: pm-migration
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=128"
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: "no"
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/libs/entity/src/data-source.migration.js"]

  postgres:
    image: postgres:15-alpine
    container_name: pm-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d project_management" ]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        compress: "true"

  redis:
    image: redis:7-alpine
    container_name: pm-redis
    restart: unless-stopped
    env_file:
      - .env.production
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 50mb --maxmemory-policy noeviction --save 900 1 --save 300 10 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"


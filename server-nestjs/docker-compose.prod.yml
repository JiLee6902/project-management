  app-api:
    platform: linux/amd64
    image: ${REGISTRY}/pm-app-api:${VERSION}
    container_name: pm-app-api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=150"
    volumes:
      - app_api_logs:/app/logs
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

  notification:
    platform: linux/amd64
    image: ${REGISTRY}/pm-notification:${VERSION}
    container_name: pm-notification
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      NODE_OPTIONS: "--max-old-space-size=64"
    volumes:
      - notification_logs:/app/logs
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

  cronjob-worker:
    platform: linux/amd64
    image: ${REGISTRY}/pm-cronjob-worker:${VERSION}
    container_name: pm-cronjob-worker
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3003
      NODE_OPTIONS: "--expose-gc --max-old-space-size=100"
    volumes:
      - cronjob_logs:/app/logs
    networks:
      - pm_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"

volumes:
  postgres_data:
  redis_data:
  # zookeeper_data:
  # zookeeper_logs:
  # kafka_data:
  app_api_logs:
  notification_logs:
  cronjob_logs:


networks:
  pm_network:
    driver: bridge

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        type: choice
        options:
          - app-api
          - notification
          - cronjob-worker
          - all
          - infrastructure
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - hetzner
          - aws
      run_migrations:
        description: 'Run migrations before deploy?'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ${{ secrets.DOCKER_USERNAME }}
  DEPLOY_HOST: ${{ github.event.inputs.target == 'hetzner' && secrets.HETZNER_HOST || secrets.PRODUCTION_HOST }}
  DEPLOY_USER: ${{ github.event.inputs.target == 'hetzner' && secrets.HETZNER_USER || secrets.PRODUCTION_USER }}

jobs:
  deploy-single:
    if: ${{ github.event.inputs.app != 'all' && github.event.inputs.app != 'infrastructure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ github.event.inputs.target == 'hetzner' && secrets.HETZNER_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
          source: "server-nestjs/docker-compose.prod.yml"
          target: "~/app"
          strip_components: 1

      - name: Deploy ${{ github.event.inputs.app }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ github.event.inputs.target == 'hetzner' && secrets.HETZNER_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          debug: true
          script_stop: true
          script: |
            set -e
            cd ~/app

            echo "Docker Login..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            export VERSION="${{ github.sha }}"
            export REGISTRY="${{ env.REGISTRY }}"

            echo "Pulling ${{ github.event.inputs.app }}..."
            docker compose --env-file .env.production -f docker-compose.prod.yml pull ${{ github.event.inputs.app }}

            if [ "${{ github.event.inputs.run_migrations }}" = "true" ]; then
              echo "Running migrations..."
              docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migration
            else
              echo "Skipping migrations"
            fi

            echo "Restarting ${{ github.event.inputs.app }}..."
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d ${{ github.event.inputs.app }}

            echo "Cleanup old images..."
            docker image prune -af --filter "until=72h"

            echo "${{ github.event.inputs.app }} deployed successfully!"

      - name: Summary
        run: |
          echo "### Deploy Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** ${{ github.event.inputs.app }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "**Migrations:** ${{ github.event.inputs.run_migrations }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-all:
    if: ${{ github.event.inputs.app == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ github.event.inputs.target == 'hetzner' && secrets.HETZNER_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
          source: "server-nestjs/docker-compose.prod.yml"
          target: "~/app"
          strip_components: 1

      - name: Deploy All Services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ github.event.inputs.target == 'hetzner' && secrets.HETZNER_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          debug: true
          script_stop: true
          script: |
            set -e
            cd ~/app

            echo "Docker Login..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            export VERSION="${{ github.sha }}"
            export REGISTRY="${{ env.REGISTRY }}"

            echo "Pulling all services..."
            docker compose --env-file .env.production -f docker-compose.prod.yml pull app-api notification cronjob-worker

            if [ "${{ github.event.inputs.run_migrations }}" = "true" ]; then
              echo "Running migrations..."
              docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migration
            else
              echo "Skipping migrations"
            fi

            echo "Restarting all services..."
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d app-api notification cronjob-worker

            echo "Cleanup old images..."
            docker image prune -af --filter "until=72h"

            echo "All services deployed successfully!"

      - name: Summary
        run: |
          echo "### Deploy All Services Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "**Migrations:** ${{ github.event.inputs.run_migrations }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-infrastructure:
    if: ${{ github.event.inputs.app == 'infrastructure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ github.event.inputs.target == 'hetzner' && secrets.HETZNER_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
          source: "server-nestjs/docker-compose.prod.yml"
          target: "~/app"
          strip_components: 1

      - name: Deploy Infrastructure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ github.event.inputs.target == 'hetzner' && secrets.HETZNER_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          debug: true
          script_stop: true
          script: |
            set -e
            cd ~/app

            echo "Starting infrastructure services..."
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis

            echo "Waiting for services to be healthy..."
            sleep 30

            echo "Infrastructure deployed!"
            docker compose --env-file .env.production -f docker-compose.prod.yml ps

      - name: Summary
        run: |
          echo "### Infrastructure Deployed! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "Services: PostgreSQL, Redis" >> $GITHUB_STEP_SUMMARY
